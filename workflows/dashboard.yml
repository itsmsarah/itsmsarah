name: Atualizar dashboard

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia, 06:00 UTC
  workflow_dispatch:       # permite rodar manualmente na aba Actions
  push:
    paths:
      - "dashboard-config.json"
      - "scripts/generate_dashboard.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar dashboard
        env:
          # Se existir o segredo GH_PAT (opcional), conta tambem contribuicoes privadas
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_dashboard.py

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg
          git diff --cached --quiet || (git commit -m "chore: atualiza dashboard" && git push)
