<g class="fade" style="animation-delay:0.0s">
<rect x="44.0" y="442" width="346.0" height="96" rx="8" fill="#0a111c" stroke="#16233a"/>
<circle class="pulse" cx="217.0" cy="458" r="7" fill="none" stroke="#1E90FF" stroke-width="1.5"/>
<circle cx="217.0" cy="458" r="2.5" fill="#87CEFA"/>
