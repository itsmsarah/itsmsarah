<circle cx="583.0" cy="458" r="2.5" fill="#87CEFA"/>
<text x="583.0" y="484" class="pname" text-anchor="middle">EntreMesas</text>
<text x="583.0" y="499" class="pdesc" text-anchor="middle">Plataforma para restaurantes: web, mobile, APIs e IoT</text>
