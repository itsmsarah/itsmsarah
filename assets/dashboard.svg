<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" role="img" aria-label="Painel de estatisticas do GitHub">
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.card{fill:#0d1520;stroke:#16233a;stroke-width:1}
.head{font-size:11px;letter-spacing:3px;fill:#4a6fa5}
.num{font-size:32px;font-weight:700;fill:#ffffff}
.lbl{font-size:11px;fill:#5c7da8}
.lang{font-size:12px;fill:#b7c6e0}
.pct{font-size:11px;fill:#5c7da8}
.tag{font-size:10px;fill:#1E90FF}
.sub{font-size:9px;fill:#5c7da8}
.pname{font-size:15px;font-weight:700;fill:#ffffff}
.pdesc{font-size:10.5px;fill:#8fa3c4}
.pill{font-size:10px;fill:#87CEFA}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.4s ease-out both}
.fade{animation:fade 1s ease-out both}
.pulse{animation:pulse 3s ease-in-out infinite}
.dot{animation:blink 1.6s ease-in-out infinite}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
</style>
<rect width="800" height="570" fill="#05080f"/>
<rect class="card" x="20" y="20" width="760" height="120" rx="8"/>
<text x="44" y="48" class="head">MISSION TELEMETRY</text>
<g class="fade" style="animation-delay:0.0s"><text x="96" y="92" class="num" text-anchor="middle" filter="url(#glow)">90</text><text x="96" y="118" class="lbl" text-anchor="middle">Commits</text></g>
<g class="fade" style="animation-delay:0.15s"><text x="248" y="92" class="num" text-anchor="middle" filter="url(#glow)">1</text><text x="248" y="118" class="lbl" text-anchor="middle">Stars</text></g>
<line x1="172" y1="62" x2="172" y2="124" stroke="#16233a"/>
<g class="fade" style="animation-delay:0.3s"><text x="400" y="92" class="num" text-anchor="middle" filter="url(#glow)">0</text><text x="400" y="118" class="lbl" text-anchor="middle">PRs</text></g>
<line x1="324" y1="62" x2="324" y2="124" stroke="#16233a"/>
<g class="fade" style="animation-delay:0.44999999999999996s"><text x="552" y="92" class="num" text-anchor="middle" filter="url(#glow)">0</text><text x="552" y="118" class="lbl" text-anchor="middle">Issues</text></g>
<line x1="476" y1="62" x2="476" y2="124" stroke="#16233a"/>
<g class="fade" style="animation-delay:0.6s"><text x="704" y="92" class="num" text-anchor="middle" filter="url(#glow)">40</text><text x="704" y="118" class="lbl" text-anchor="middle">Repos</text></g>
<line x1="628" y1="62" x2="628" y2="124" stroke="#16233a"/>
<rect class="card" x="20" y="160" width="760" height="220" rx="8"/>
<text x="44" y="190" class="head">LANGUAGE TELEMETRY</text>
<line x1="420" y1="180" x2="420" y2="362" stroke="#16233a"/>
<text x="444" y="190" class="head">FOCUS SECTORS</text>
<text x="44" y="224" class="lang">JavaScript</text>
<rect class="bar" style="animation-delay:0.0s" x="150" y="214" width="48.0" height="10" rx="3" fill="#f1e05a"/>
<text x="396" y="224" class="pct" text-anchor="end">28.2%</text>
<text x="44" y="250" class="lang">Java</text>
<rect class="bar" style="animation-delay:0.1s" x="150" y="240" width="43.5" height="10" rx="3" fill="#b07219"/>
<text x="396" y="250" class="pct" text-anchor="end">25.6%</text>
<text x="44" y="276" class="lang">HTML</text>
<rect class="bar" style="animation-delay:0.2s" x="150" y="266" width="36.9" height="10" rx="3" fill="#e34c26"/>
<text x="396" y="276" class="pct" text-anchor="end">21.7%</text>
<text x="44" y="302" class="lang">CSS</text>
<rect class="bar" style="animation-delay:0.30000000000000004s" x="150" y="292" width="34.2" height="10" rx="3" fill="#663399"/>
<text x="396" y="302" class="pct" text-anchor="end">20.1%</text>
<text x="44" y="328" class="lang">MDX</text>
<rect class="bar" style="animation-delay:0.4s" x="150" y="318" width="6.0" height="10" rx="3" fill="#fcb32c"/>
<text x="396" y="328" class="pct" text-anchor="end">2.1%</text>
<text x="44" y="354" class="lang">Python</text>
<rect class="bar" style="animation-delay:0.5s" x="150" y="344" width="6.0" height="10" rx="3" fill="#3572A5"/>
<text x="396" y="354" class="pct" text-anchor="end">1.2%</text>
<polygon points="600.0,262.7 616.7,291.7 583.3,291.7" fill="none" stroke="#1e2d45" stroke-width="1"/>
<polygon points="600.0,243.3 633.5,301.3 566.5,301.3" fill="none" stroke="#1e2d45" stroke-width="1"/>
<polygon points="600.0,224.0 650.2,311.0 549.8,311.0" fill="none" stroke="#1e2d45" stroke-width="1"/>
<line x1="600" y1="282" x2="600.0" y2="224.0" stroke="#1e2d45"/>
<line x1="600" y1="282" x2="650.2" y2="311.0" stroke="#1e2d45"/>
<line x1="600" y1="282" x2="549.8" y2="311.0" stroke="#1e2d45"/>
<polygon class="pulse" points="600.0,224.0 620.1,293.6 590.0,287.8" fill="#1E90FF" fill-opacity=".25" stroke="#1E90FF" stroke-width="1.5"/>
<text x="600.0" y="212.0" class="tag" text-anchor="middle">Front-end</text>
<text x="600.0" y="224.0" class="sub" text-anchor="middle">(5)</text>
<text x="664.1" y="323.0" class="tag" text-anchor="start">Back-end</text>
<text x="664.1" y="335.0" class="sub" text-anchor="start">(2)</text>
